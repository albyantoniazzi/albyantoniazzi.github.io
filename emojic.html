  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Google Sans Code"', 'ui-monospace', 'Menlo', 'monospace'],
            mono: ['"Google Sans Code"', 'monospace'],
          },
          colors: {
            beige: {
              50: '#fbf9f4',
              100: '#f7f3ea',
              200: '#eee6d4',
              300: '#e3d8be',
              400: '#cbbda0',
              700: '#524b3e',
              800: '#393328',
              900: '#221f18',

          }
        }
      }
    }
  </script>

  <style>
    /* Solid background system */
    :root {
      --bg-color: #EBF1E5;
      --text-color: #2A2E23;
    }

    html.dark {
      --bg-color: #1E2020;
      --text-color: #f3f4f6;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Global smooth transition for theme change */
    header, footer, .emoji-card, input, section > div {
      transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
                  border-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
                  color 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Google official emoji rendering (Noto Color Emoji) */
    .emoji-font {
      font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
      font-size: clamp(2.1rem, 3.8vw, 3.1rem);
      line-height: 1;
    }

    /* Custom theme scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
    }
    html.dark ::-webkit-scrollbar-track {
      background: #1E2020;
    }
    html.dark ::-webkit-scrollbar-thumb {
      background: #333636;
      border-radius: 9999px;
    }
    html.dark ::-webkit-scrollbar-thumb:hover {
      background: #454949;
    }

    html:not(.dark) ::-webkit-scrollbar-track {
      background: #EBF1E5;
    }
    html:not(.dark) ::-webkit-scrollbar-thumb {
      background: #c7d2c0;
      border-radius: 9999px;
    }
    html:not(.dark) ::-webkit-scrollbar-thumb:hover {
      background: #b0bfa7;
    }

    /* Yin Yang rotation transition */
    #theme-icon {
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center;
    }

    /* Subtle press animation */
    .emoji-card:active {
      transform: scale(0.9);
    }
    /* Variant indicator pip in corner */
    .has-variants::after {
      content: '';
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 4px;
      height: 4px;
      border-radius: 9999px;
      background-color: currentColor;
      opacity: 0.4;
    }

    /* Long-press variant popover bubble */
    #variant-popover {
      position: fixed;
      z-index: 60;
      transform: translate(-50%, -100%) translateY(-10px);
      transition: opacity 0.15s ease, transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #variant-popover.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -100%) translateY(-2px) scale(0.95);
    }
  </style>
</head>

        <input 
          id="search-input"

        <!-- Clear Search Button -->
        <button 
          id="clear-btn" 
          class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-[#2A2E23]/60 hover:text-[#2A2E23] dark:text-neutral-400 dark:hover:text-white"

          type="button"

        let charWithTone = baseChar;

          if (baseChar.includes('\u200D')) {
            const parts = baseChar.split('\u200D');
            parts[0] = parts[0] + t.mod;
            charWithTone = parts.join('\u200D');
          } else {
            charWithTone = baseChar + t.mod;
          }
        }
        return {

          name: t.mod ? `${name} (${t.name})` : name

      { char: "🏁", name: "chequered flag", cat: "Flags", tags: ["finish line", "race", "f1", "winner"] },
      { char: "🚩", name: "triangular flag", cat: "Flags", tags: ["red flag", "warning", "post"] },
      { char: "🎌", name: "crossed flags", cat: "Flags", tags: ["japan", "celebrate"] },
      { char: "🏴", name: "black flag", cat: "Flags", tags: ["pirate", "dark"] },
      { char: "🏳️", name: "white flag", cat: "Flags", tags: ["surrender", "peace"] },
      { char: "🏳️‍🌈", name: "rainbow flag", cat: "Flags", tags: ["pride", "lgbtq", "equality"] },
      { char: "🏳️‍⚧️", name: "transgender flag", cat: "Flags", tags: ["trans", "pride"] },
      { char: "🏴‍☠️", name: "pirate flag", cat: "Flags", tags: ["jolly roger", "skull", "bones"] }
    ];

    // Build the complete country flags list programmatically for 100% world coverage
    const COUNTRY_FLAG_EMOJIS = COUNTRIES_LIST.map(country => ({
      char: getCountryFlag(country.code),
      name: `${country.name} flag`,
      cat: "Flags",
      tags: ["flag", country.code.toLowerCase(), country.name.toLowerCase(), ...(country.tags || [])]
    }));

    // Merge baseline and complete flags
    const EMOJI_DATABASE = [...BASE_DATABASE, ...COUNTRY_FLAG_EMOJIS];

    const container = document.getElementById('emoji-container');
    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-btn');
    const emptyState = document.getElementById('empty-state');
    const resetSearchBtn = document.getElementById('reset-search-btn');
    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    const themeIcon = document.getElementById('theme-icon');
    const variantPopover = document.getElementById('variant-popover');

    let toastTimeout = null;
    let rotationDegrees = 0;
    let activeLongPressTimer = null;
    let longPressTriggered = false;

    // Dismiss variant popover on outside click or scroll
    function hideVariantPopover() {
      variantPopover.classList.add('hidden');
      variantPopover.innerHTML = '';
    }

    window.addEventListener('click', (e) => {
      if (!variantPopover.contains(e.target) && !e.target.closest('.emoji-card')) {
        hideVariantPopover();
      }
    });

    window.addEventListener('scroll', hideVariantPopover, { passive: true });

    // Show floating popover with skin-tone variations
    function showVariantPopover(targetBtn, emojiItem) {
      const variants = emojiItem.variants || (emojiItem.skinTone ? generateSkinToneVariants(emojiItem.char, emojiItem.name) : []);
      if (!variants || variants.length <= 1) return;

      variantPopover.innerHTML = '';
      variants.forEach(variant => {
        const vBtn = document.createElement('button');
        vBtn.type = 'button';
        vBtn.className = 'w-10 h-10 sm:w-11 sm:h-11 flex items-center justify-center rounded-xl hover:bg-[#d8e2d1] dark:hover:bg-white/10 transition-all text-2xl sm:text-[1.75rem] active:scale-95';
        vBtn.innerHTML = `<span class="emoji-font leading-none select-none">${variant.char}</span>`;
        vBtn.setAttribute('title', variant.name);
        vBtn.setAttribute('aria-label', `Copy ${variant.name}`);

        vBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          copyToClipboard(variant.char, variant.name);
          hideVariantPopover();
        });

        variantPopover.appendChild(vBtn);
      });

      // Position the popover right above the card
      const rect = targetBtn.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const topY = rect.top;

      variantPopover.style.left = `${Math.max(170, Math.min(window.innerWidth - 170, centerX))}px`;
      variantPopover.style.top = `${topY}px`;
      variantPopover.classList.remove('hidden');

      // Subtle haptic vibration if supported
      if (navigator.vibrate) {
        navigator.vibrate(35);
      }
    }

    // Theme Switcher Logic (Dark mode default, Beige light mode)
    function toggleTheme() {
      const htmlEl = document.documentElement;
      const isDark = htmlEl.classList.contains('dark');
      
      // Rotate Yin-Yang smoothly forward 180 degrees every click
      rotationDegrees += 180;
      themeIcon.style.transform = `rotate(${rotationDegrees}deg)`;

      if (isDark) {
        htmlEl.classList.remove('dark');
      } else {
        htmlEl.classList.add('dark');
      }
    }

    themeToggleBtn.addEventListener('click', toggleTheme);

    // Helper to group array by property
    function groupBy(array, key) {
      return array.reduce((result, currentItem) => {
        (result[currentItem[key]] = result[currentItem[key]] || []).push(currentItem);
        return result;
      }, {});
    }

    // Function to render items
    function renderEmojis(items, isSearching = false) {
      container.innerHTML = '';
      hideVariantPopover();

      const totalCount = items.length;

      if (totalCount === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      if (isSearching) {
        // Flat grid for search results - clean borderless emoji grid with spacious gap
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-[repeat(auto-fill,minmax(3.25rem,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(4rem,1fr))] gap-3 sm:gap-4 md:gap-5';

        items.forEach(emoji => {
          grid.appendChild(createEmojiButton(emoji));
        });

        container.appendChild(grid);
      } else {
        // Grouped by Category
        const grouped = groupBy(items, 'cat');

        for (const [catName, emojiList] of Object.entries(grouped)) {
          const section = document.createElement('section');
          section.className = 'space-y-3';

          // Category Header
          const header = document.createElement('div');
          header.className = 'flex items-center space-x-2 border-b border-[#2A2E23]/10 dark:border-white/10 pb-2';
          header.innerHTML = `
            <h2 class="text-[11px] uppercase tracking-wider font-semibold text-[#2A2E23]/75 dark:text-neutral-400 font-mono">${catName}</h2>
          `;
          section.appendChild(header);

          // Grid of emojis - clean borderless glyph layout with spacious gap
          const grid = document.createElement('div');
          grid.className = 'grid grid-cols-[repeat(auto-fill,minmax(3.25rem,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(4rem,1fr))] gap-3 sm:gap-4 md:gap-5';

          emojiList.forEach(emoji => {
            grid.appendChild(createEmojiButton(emoji));
          });

          section.appendChild(grid);
          container.appendChild(section);
        }
      }
    }

    // Creates individual interactive emoji cell button with hold-to-vary support (no box, no text caption)
    function createEmojiButton(item) {
      const hasVariants = item.skinTone || (item.variants && item.variants.length > 1);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `emoji-card group relative flex items-center justify-center aspect-square p-1 rounded-xl hover:scale-125 focus:scale-125 transition-transform duration-150 focus:outline-none select-none ${hasVariants ? 'has-variants' : ''}`;
      btn.setAttribute('aria-label', `Copy ${item.name} (${item.char})`);
      btn.setAttribute('title', hasVariants ? `${item.name} (hold for skin tones)` : item.name);

      btn.innerHTML = `<span class="emoji-font leading-none select-none">${item.char}</span>`;

      // Pointer event listeners for prolonged press / hold
      const startHold = (e) => {
        if (!hasVariants) return;
        longPressTriggered = false;
        activeLongPressTimer = setTimeout(() => {
          longPressTriggered = true;
          showVariantPopover(btn, item);
        }, 380);
      };

      const cancelHold = () => {
        if (activeLongPressTimer) {
          clearTimeout(activeLongPressTimer);
          activeLongPressTimer = null;
        }
      };

      btn.addEventListener('pointerdown', startHold);
      btn.addEventListener('pointerup', cancelHold);
      btn.addEventListener('pointerleave', cancelHold);
      btn.addEventListener('pointercancel', cancelHold);

      // Support right-click to open variants immediately
      btn.addEventListener('contextmenu', (e) => {
        if (hasVariants) {
          e.preventDefault();
          showVariantPopover(btn, item);
        }
      });

      // Standard click handler (fires if not consumed by long press)
      btn.addEventListener('click', (e) => {
        if (longPressTriggered) {
          longPressTriggered = false;
          return;
        }
        copyToClipboard(item.char, item.name);
      });

      return btn;
    }

    // Reliable fallback clipboard copy using execCommand as mandated by iframe constraints
    function copyToClipboard(text, name) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '0';
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, 99999);

      let success = false;
      try {
        success = document.execCommand('copy');
      } catch (err) {
        console.error('Copy command error:', err);
      }
      document.body.removeChild(textarea);

      if (success) {
        showToast(text, name);
      } else {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text)
            .then(() => showToast(text, name))
            .catch(() => showToast(text, 'Copied!'));
        }
      }
    }

    // Centered Toast Notification Handler
    function showToast(emoji, name) {
      const toast = document.getElementById('toast');
      const toastEmoji = document.getElementById('toast-emoji');
      const toastText = document.getElementById('toast-text');

      toastEmoji.textContent = emoji;
      toastText.textContent = name;

      // Animate from center with smooth pop
      toast.classList.remove('opacity-0', 'pointer-events-none', 'scale-90');
      toast.classList.add('opacity-100', 'scale-100');

      if (toastTimeout) {
        clearTimeout(toastTimeout);
      }

      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'scale-100');
        toast.classList.add('opacity-0', 'pointer-events-none', 'scale-90');
      }, 1600);
    }

    // Live filter function matching name, category, and keyword tags
    function filterEmojis() {
      const query = searchInput.value.trim().toLowerCase();

      if (query.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      if (!query) {
        renderEmojis(EMOJI_DATABASE, false);
        return;
      }

      const terms = query.split(/\s+/).filter(Boolean);

      const filtered = EMOJI_DATABASE.filter(item => {
        const itemText = `${item.char} ${item.name} ${item.cat} ${item.tags.join(' ')}`.toLowerCase();
        return terms.every(term => itemText.includes(term));
      });

      renderEmojis(filtered, true);
    }

    // Search events
    searchInput.addEventListener('input', filterEmojis);

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.focus();
      filterEmojis();
    });

    resetSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchInput.focus();
      filterEmojis();
    });

    // Keyboard shortcut: Pressing "/" focuses search, "Escape" clears it
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.value = '';
        filterEmojis();
        searchInput.blur();
        hideVariantPopover();
      }
    });

    // Initial render
    renderEmojis(EMOJI_DATABASE, false);
  </script>
</body>
</html>
